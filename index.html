<title>見積書作成（吉祥寺駅前歯科・矯正歯科）</title>
<style>
  :root{
    --accent:#796345;
    --accent-soft:#f0e6d6;
    --chrome-bg:#f4f1ec;
    --panel:#ffffff;
    --panel-ink:#1c2430;
    --panel-sub:#5b6675;
    --border:#d6dce4;
    --danger:#b3352f;
    --sheet-bg:#ffffff;
    --sheet-ink:#1c2430;
    --sheet-line:#333c48;
    --sheet-line-soft:#c9ced6;
    --bar:#d9dce1;
    --shadow:0 6px 24px rgba(28,36,48,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --accent:#e0b770; --accent-soft:#3a3025; --chrome-bg:#1a1714;
      --panel:#1e2530; --panel-ink:#e6eaf1; --panel-sub:#98a2b3;
      --border:#343e4d; --danger:#e07b76; --shadow:0 6px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    --accent:#796345; --accent-soft:#f0e6d6; --chrome-bg:#f4f1ec;
    --panel:#ffffff; --panel-ink:#1c2430; --panel-sub:#5b6675;
    --border:#d6dce4; --danger:#b3352f; --shadow:0 6px 24px rgba(28,36,48,.12);
  }
  :root[data-theme="dark"]{
    --accent:#e0b770; --accent-soft:#3a3025; --chrome-bg:#1a1714;
    --panel:#1e2530; --panel-ink:#e6eaf1; --panel-sub:#98a2b3;
    --border:#343e4d; --danger:#e07b76; --shadow:0 6px 24px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chrome-bg);
    color:var(--panel-ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    font-size:15px;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- app chrome ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .toolbar h1{
    font-size:15px;font-weight:600;margin:0 auto 0 0;
    letter-spacing:.08em;color:var(--panel-sub);
  }
  button{
    font:inherit;color:var(--panel-ink);
    background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:9px 14px;min-height:42px;
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;letter-spacing:.05em;}
  @media (prefers-color-scheme: dark){ .btn-primary{color:#0f1520;} }
  :root[data-theme="dark"] .btn-primary{color:#0f1520;}
  :root[data-theme="light"] .btn-primary{color:#fff;}

  .stage{max-width:900px;margin:0 auto;padding:16px 12px 60px;}

  /* ---------- A4 sheet ---------- */
  .sheet-wrap{overflow:hidden;}
  .sheet{
    width:210mm;min-height:295mm;
    display:flex;flex-direction:column;
    background:#fff;color:#14171c;
    box-shadow:var(--shadow);
    padding:16mm 18mm 14mm;
    transform-origin:top left;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
    font-size:10.5pt;line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  .sheet input,.sheet select{
    font:inherit;color:inherit;background:transparent;
    border:none;border-bottom:1px dashed transparent;
    padding:2px 3px;border-radius:0;width:100%;
  }
  .sheet input:hover{border-bottom-color:var(--sheet-line-soft);}
  .sheet input:focus,.sheet select:focus{
    outline:none;border-bottom:1px solid var(--accent);
    background:rgba(121,99,69,.07);
  }
  .sheet ::placeholder{color:#a8b0bc;}

  .doc-title{
    text-align:center;
    font-size:18pt;font-weight:600;letter-spacing:.9em;text-indent:.9em;
    margin:0 0 2.5mm;
    color:#796345;
  }
  .title-rule{
    height:1.2mm;
    border-top:.35mm solid #cb890c;
    border-bottom:.8mm solid #796345;
    margin-bottom:9mm;
  }
  .head-row{display:flex;align-items:flex-end;gap:6mm;}
  .patient{
    display:flex;align-items:baseline;gap:2mm;flex:1;max-width:92mm;
    border-bottom:.3mm solid #14171c;padding-bottom:1mm;
    align-self:flex-start;margin-top:6mm;
  }
  .patient input{font-size:13.5pt;font-weight:500;letter-spacing:.1em;}
  .patient .sama{flex:none;font-size:11.5pt;}
  .issuer{flex:none;width:66mm;display:flex;flex-direction:column;gap:.5mm;}
  .issuer input{text-align:right;padding:1px 3px;}
  .issuer .sheet-logo{width:57mm;height:auto;align-self:flex-end;margin:1mm 0 1.5mm;}
  .made-date{display:flex;align-items:baseline;justify-content:flex-end;gap:2mm;font-size:10pt;margin-bottom:2mm;}
  .made-date label{flex:none;color:#a3906f;font-size:8.5pt;}
  .made-date input{width:30mm;text-align:right;}
    .issuer .c-addr{font-size:8.5pt;color:#6b6257;}
  .issuer .c-tel{font-size:8.5pt;color:#6b6257;}

  .grand{
    margin-top:5mm;
    background:#faf4ea;
    border-top:.3mm solid #cb890c;
    border-bottom:.3mm solid #cb890c;
    padding:4mm 0;
    display:flex;justify-content:center;align-items:baseline;gap:7mm;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .grand .label{font-size:10.5pt;letter-spacing:.5em;}
  .grand .amount{font-size:17pt;font-weight:600;letter-spacing:.05em;color:#796345;}
  .grand .tax-note{font-size:8.5pt;color:#a3906f;}

  /* ---------- item table ---------- */
  .items-area{margin-top:6mm;}
  table.items{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  table.items th{
    background:#f4ecdd;color:#7a5f2e;
    font-weight:600;font-size:9pt;letter-spacing:.25em;
    padding:2.2mm 1.5mm;text-align:center;
    border-top:.35mm solid #cb890c;border-bottom:.35mm solid #cb890c;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  table.items td{
    border-bottom:.15mm solid #e8e0d2;
    padding:1.2mm 1mm;vertical-align:middle;
  }
  .col-teeth{width:34mm;}
  .col-qty{width:12mm;}
  .col-price{width:24mm;}
  .col-amt{width:27mm;}
  .col-del{width:11mm;}
  td.c-name input{font-size:10.5pt;font-weight:500;}
  td.c-qty input{text-align:center;font-size:10.5pt;}
  td.c-price input{text-align:right;font-size:10.5pt;}
  td.c-amt{text-align:right;font-size:10.5pt;font-weight:500;padding-right:2mm;}
  .teeth{
    position:relative;width:30mm;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;
    font-size:9pt;letter-spacing:.2em;
    cursor:pointer;border-radius:1mm;
  }
  .teeth:hover{background:rgba(121,99,69,.08);}
  .teeth:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .teeth .q{
    border:0 solid #6b6257;
    min-height:5.5mm;display:flex;align-items:center;
    padding:.2mm 1.2mm;white-space:nowrap;
  }
  .teeth.empty .q{border-color:#d9cdb8;}
  .teeth .q.ur{border-right-width:.3mm;border-bottom-width:.3mm;justify-content:flex-end;}
  .teeth .q.ul{border-bottom-width:.3mm;}
  .teeth .q.lr{border-right-width:.3mm;justify-content:flex-end;}
  .teeth-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:7.5pt;letter-spacing:.15em;color:var(--accent);opacity:.75;
    pointer-events:none;
  }
  .item-del{
    width:34px;min-height:34px;padding:2px;border-radius:6px;
    border:1px solid var(--sheet-line-soft);color:#8c95a3;background:#fff;
    font-size:12px;line-height:1;display:block;margin:0 auto;
  }
  .item-del:hover{color:var(--danger);border-color:var(--danger);}
  .item-add{
    display:block;margin:3mm auto 0;padding:1.6mm 6mm;min-height:0;
    border:.3mm dashed var(--accent);border-radius:1.5mm;
    background:transparent;color:var(--accent);
    font-family:inherit;font-size:9.5pt;letter-spacing:.08em;
  }
  .item-add:hover{background:rgba(121,99,69,.06);}
  .pl-empty{
    border:1.5px dashed var(--border);border-radius:10px;
    padding:18px 14px;text-align:center;line-height:1.9;
    color:var(--panel-sub);font-size:13px;
  }
  .items-empty{
    border:1.5px dashed var(--sheet-line-soft);color:#a8b0bc;
    text-align:center;padding:8mm 4mm;font-size:10pt;margin-top:2mm;
  }

  /* ---------- note box ---------- */
  .note-box{
    margin-top:7mm;
    border:.2mm solid #ddcdb0;border-radius:1mm;
    padding:2.5mm 3mm;
    display:flex;gap:4mm;align-items:flex-start;
    min-height:18mm;
  }
  .note-box .note-label{flex:none;color:#796345;font-size:9pt;letter-spacing:.3em;padding-top:1mm;}
  .note-box textarea{
    flex:1;border:none;resize:none;background:transparent;
    font:inherit;font-size:9.5pt;line-height:1.7;color:inherit;
    min-height:14mm;padding:0;
  }
  .note-box textarea:focus{outline:none;}

  /* ---------- totals ---------- */
  .totals-row{display:flex;justify-content:flex-end;margin-top:3mm;}
  .totals-rule{display:none;}
  .totals{
    width:68mm;font-size:10.5pt;
  }
  .totals .row{display:flex;justify-content:space-between;align-items:baseline;padding:1.2mm 1mm;}
  .totals .row .amt{font-weight:500;}
  .totals .row.total{
    font-weight:600;font-size:12.5pt;
    color:#796345;
    border-top:.3mm solid #796345;
    border-bottom:1mm double #796345;
    margin-top:1mm;padding:2mm 1mm;
  }
  .totals select{
    width:auto;border:none;font-size:8.5pt;padding:0 0 0 1mm;color:#555;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  .totals-bottom-rule{display:none;}

  /* ---------- price list panel ---------- */
  .pricelist{
    margin-top:20px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:14px;
  }
  .pl-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .pl-head h2{font-size:14px;margin:0 auto 0 0;letter-spacing:.06em;}
  .pl-hint{font-size:12px;color:var(--panel-sub);margin:0 0 10px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tab{
    border:1px solid var(--border);border-radius:999px;
    background:var(--chrome-bg);padding:8px 15px;min-height:40px;
    font-size:14px;
  }
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .tab.active{color:#0f1520;}
  @media (prefers-color-scheme: dark){ .tab.active{color:#0f1520;} }
  :root[data-theme="light"] .tab.active{color:#fff;}

  .group{margin-bottom:14px;}
  .group h3{
    font-size:12px;color:var(--panel-sub);letter-spacing:.1em;
    margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:flex;align-items:baseline;gap:8px;
    border:1px solid var(--border);border-radius:999px;
    background:var(--chrome-bg);padding:9px 16px;min-height:42px;
    text-align:left;
  }
  .chip .price{color:var(--panel-sub);font-size:13px;font-variant-numeric:tabular-nums;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}

  .pl-edit-rows{display:grid;gap:8px;}
  .pl-edit-rows .m-row{display:flex;gap:8px;align-items:center;}
  .pl-edit-rows input{
    font:inherit;color:var(--panel-ink);background:var(--chrome-bg);
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;min-height:42px;
  }
  .pl-edit-rows .m-name{flex:1;min-width:0;}
  .pl-edit-rows .m-price{width:120px;text-align:right;font-variant-numeric:tabular-nums;}
  .pl-add{border-style:dashed;color:var(--accent);}
  .pl-reset{color:var(--danger);border-color:var(--border);font-size:13px;}

  /* ---------- drawer (saved docs) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,20,28,.45);z-index:40;
    display:none;align-items:flex-start;justify-content:center;padding:24px 12px;
  }
  .overlay.open{display:flex;}
  .drawer{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    width:min(560px,100%);max-height:82vh;overflow-y:auto;
    box-shadow:var(--shadow);padding:16px;
  }
  .drawer h2{font-size:15px;margin:0 0 12px;letter-spacing:.06em;}
  .doc-item{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;
  }
  .doc-item.current{border-color:var(--accent);background:var(--accent-soft);}
  .doc-item .info{flex:1;min-width:0;cursor:pointer;}
  .doc-item .info .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .doc-item .info .s{font-size:12px;color:var(--panel-sub);font-variant-numeric:tabular-nums;}
  .doc-item button{min-height:38px;padding:6px 10px;font-size:13px;}
  .drawer-close{width:100%;margin-top:6px;}

  .save-note{text-align:center;font-size:12px;color:var(--panel-sub);margin-top:14px;}

  /* ---------- confirm dialog / PDF viewer ---------- */
  #confirmOverlay{z-index:70;}   /* 保存一覧・歯式パネルより常に手前 */
  #pdfOverlay{z-index:60;}
  .confirm-box{width:min(440px,100%);}
  .confirm-box p{margin:0;white-space:pre-line;line-height:1.7;}
  .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;}
  .pdf-box{width:min(720px,100%);}
  .pdf-box .sub{font-size:13px;color:var(--panel-sub);margin:-4px 0 12px;line-height:1.7;}
  #pdfPages img{display:block;width:100%;border:1px solid var(--border);margin-bottom:10px;}
  a.dl-link{
    display:inline-flex;align-items:center;justify-content:center;
    font:inherit;color:var(--panel-ink);background:var(--panel);
    border:1px solid var(--border);border-radius:8px;
    padding:9px 14px;min-height:42px;text-decoration:none;
  }

  /* ---------- tooth picker ---------- */
  .tooth-drawer{width:min(660px,100%);}
  .tooth-drawer .sub{font-size:12px;color:var(--panel-sub);margin:-6px 0 12px;}
  .mouth-scroll{overflow-x:auto;padding-bottom:4px;}
  .mouth{
    display:grid;grid-template-columns:1fr 1fr;
    min-width:580px;
    font-variant-numeric:tabular-nums;
  }
  .quad{display:flex;flex-direction:column;gap:6px;padding:10px 8px;}
  .quad.qur,.quad.qlr{align-items:flex-end;border-right:2px solid var(--panel-ink);}
  .quad.qur,.quad.qul{border-bottom:2px solid var(--panel-ink);}
  .quad .lbl{font-size:11px;color:var(--panel-sub);letter-spacing:.1em;}
  .quad.qur .lbl,.quad.qlr .lbl{align-self:flex-start;}
  .quad.qul .lbl,.quad.qll .lbl{align-self:flex-end;}
  .trow{display:flex;gap:3px;}
  .tooth{
    width:33px;min-width:33px;min-height:40px;padding:0;
    border-radius:8px;font-size:14px;
    border:1px solid var(--border);background:var(--chrome-bg);color:var(--panel-ink);
  }
  .tooth.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  :root[data-theme="dark"] .tooth.sel{color:#0f1520;}
  @media (prefers-color-scheme: dark){ .tooth.sel{color:#0f1520;} }
  :root[data-theme="light"] .tooth.sel{color:#fff;}
  .tooth-actions{display:flex;gap:8px;margin-top:14px;}
  .tooth-actions .spacer{flex:1;}
  .tooth-preview{
    text-align:center;font-size:15px;letter-spacing:.2em;
    margin-top:12px;color:var(--panel-ink);
  }

  /* ---------- print ---------- */
  /* 「印刷」ボタン用：生成した見積書画像をそのままA4で刷る領域（画面には出さない） */
  #printArea{display:none;}
  @page{size:A4 portrait;margin:0;}
  @media print{
    body{background:#fff;}
    .toolbar,.pricelist,.save-note,.overlay,.item-del,.item-add,.items-empty,.teeth-hint,.col-del,.c-del{display:none !important;}
    body.print-image > *{display:none !important;}
    body.print-image > #printArea{display:block !important;}
    #printArea img{
      display:block;width:210mm;height:297mm;object-fit:contain;
      page-break-after:always;break-after:page;
    }
    #printArea img:last-child{page-break-after:auto;break-after:auto;}
    .stage{max-width:none;padding:0;margin:0;}
    .sheet-wrap{height:auto !important;overflow:visible;}
    .sheet{
      transform:none !important;box-shadow:none;
      width:auto;min-height:269mm;margin:0;
      color:#1c2430;background:#fff;
    }
    .sheet ::placeholder{color:transparent;}
    .sheet input{border-bottom-color:transparent !important;background:transparent !important;}
    .totals select{-webkit-appearance:none;appearance:none;color:#555;}
  }
</style>

<div id="printArea"></div>

  var logoImg = new Image(); logoImg.src = LOGO_SRC;
  var CLINIC_DEFAULT = {
    name:'吉祥寺駅前歯科・矯正歯科',   /* ロゴに医院名が入っているため用紙には描画しない */
    address:'',
    tel:''
  };

  /* ---------- default price list (補綴価格表250226・【R7.4~】矯正料金表 より) ---------- */
  function DEFAULT_PRICES(){ return [
    {tab:'自費料金', groups:[
      {g:'未登録', items:[]}
    ]}
  ]; }

  /* ---------- state ---------- */
  function todayStr(){
    var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate());
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function newDoc(){
    return {
      id: uid(), patient:'', issueDate: todayStr(), taxRate:0,
      items:[], note:'', updatedAt: Date.now()
    };
  }

  var state = { docs:[], currentId:null, prices:null,
    clinic:{name:CLINIC_DEFAULT.name, address:CLINIC_DEFAULT.address, tel:CLINIC_DEFAULT.tel} };
  try{
    var saved = JSON.parse(localStorage.getItem(LS_KEY));
    if(saved && saved.docs && saved.docs.length) state = saved;
  }catch(e){}
  if(!state.docs.length){
    var d0=newDoc();
    state.docs=[d0]; state.currentId=d0.id;
  }
  if(!state.prices) state.prices = DEFAULT_PRICES();
  if(!state.clinic) state.clinic = {name:CLINIC_DEFAULT.name, address:CLINIC_DEFAULT.address, tel:CLINIC_DEFAULT.tel};

  /* 料金表の版が上がっていたら保存済み料金を新既定値で置き換える */
  if(state.pricesVersion !== PRICES_VERSION){
    state.prices = DEFAULT_PRICES();
    state.pricesVersion = PRICES_VERSION;
  }


  /* 旧形式（歯式が文字列）からの移行 */
  state.docs.forEach(function(d){
    (d.items||[]).forEach(function(it){
      if(!it.teeth) it.teeth={};
      ['ur','ul','lr','ll'].forEach(function(q){
        var v=it.teeth[q];
        if(Array.isArray(v)) return;
        var m=String(v==null?'':v).toUpperCase().match(/[1-8A-E]/g);
        it.teeth[q]=m||[];
      });
    });
  });

  function cur(){
    for(var i=0;i<state.docs.length;i++) if(state.docs[i].id===state.currentId) return state.docs[i];
    state.currentId=state.docs[0].id;
    return state.docs[0];
  }

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      cur().updatedAt=Date.now();
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    },250);
  }

  /* ---------- helpers ---------- */
  function $(id){ return document.getElementById(id); }
  function num(v){
    if(v==null) return 0;
    var n=parseFloat(String(v).replace(/[,，¥￥\s]/g,''));
    return isNaN(n)?0:n;
  }
  function fmt(n){ return Math.floor(n).toLocaleString('ja-JP'); }
  function yen(n){ return '¥'+fmt(n); }
  function toothCount(t){
    return ['ur','ul','lr','ll'].reduce(function(a,q){ return a+((t[q]||[]).length); },0);
  }
  /* 歯式の並び：正中に近い歯が中央線側に来るよう、右側は遠心→近心、左側は近心→遠心 */
  function posVal(label){
    if(/[1-8]/.test(label)) return Number(label);
    return {A:1,B:2,C:3,D:4,E:5}[label]+0.4;
  }
  function qText(arr, rightSide){
    var s=(arr||[]).slice().sort(function(a,b){
      return rightSide ? posVal(b)-posVal(a) : posVal(a)-posVal(b);
    });
    return s.join('');
  }
  function teethNotation(t){
    var up=qText(t.ur,true)+'｜'+qText(t.ul,false);
    var low=qText(t.lr,true)+'｜'+qText(t.ll,false);
    return {up:up, low:low};
  }

  /* ---------- 自前ダイアログ（サンドボックス内では confirm/alert が無効のため） ---------- */
  var confirmResolve=null;
  function appConfirm(msg, okLabel, hideCancel){
    return new Promise(function(res){
      confirmResolve=res;
      $('confirmMsg').textContent=msg;
      $('btnConfirmOk').textContent=okLabel||'OK';
      $('btnConfirmCancel').style.display=hideCancel?'none':'';
      $('confirmOverlay').classList.add('open');
    });
  }
  function appNotice(msg){ return appConfirm(msg,'OK',true); }
  function settleConfirm(v){
    $('confirmOverlay').classList.remove('open');
    if(confirmResolve){ var r=confirmResolve; confirmResolve=null; r(v); }
  }
  $('btnConfirmOk').addEventListener('click',function(){ settleConfirm(true); });
  $('btnConfirmCancel').addEventListener('click',function(){ settleConfirm(false); });
  $('confirmOverlay').addEventListener('click',function(e){ if(e.target===this) settleConfirm(false); });

  /* ---------- totals ---------- */
  function lineAmount(it){ return Math.floor(num(it.price)*num(it.qty)); }
  function updateTotals(){
    var doc=cur(), sub=0;
    doc.items.forEach(function(it,i){
      var a=lineAmount(it);
      sub+=a;
      var el=document.querySelector('[data-amount="'+i+'"]');
      if(el) el.textContent=fmt(a);
    });
    /* 料金表・単価はすべて税込のため、小計＝合計 */
    $('tTotal').textContent=yen(sub);
    $('grandTotal').textContent=yen(sub);
  }

  /* ---------- item table ---------- */
  function renderItems(){
    var doc=cur(), area=$('itemsArea');
    area.innerHTML='';

    var table=document.createElement('table');
    table.className='items';
    var thead=document.createElement('thead');
    var htr=document.createElement('tr');
    [['品名',''],['部位','col-teeth'],['数量','col-qty'],['単価','col-price'],['金額','col-amt'],['','col-del']].forEach(function(h){
      var th=document.createElement('th');
      th.textContent=h[0];
      if(h[1]) th.className=h[1];
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody=document.createElement('tbody');
    doc.items.forEach(function(it, idx){
      var tr=document.createElement('tr');

      /* 品名 */
      var tdName=document.createElement('td');
      tdName.className='c-name';
      var nameIn=document.createElement('input');
      nameIn.value=it.name; nameIn.placeholder='処置・材料名';
      nameIn.addEventListener('input',function(){ it.name=nameIn.value; save(); });
      tdName.appendChild(nameIn);
      tr.appendChild(tdName);

      /* 部位（歯式ミニ十字・タップで選択） */
      var tdTeeth=document.createElement('td');
      var teeth=document.createElement('div');
      teeth.className='teeth'+(toothCount(it.teeth)===0?' empty':'');
      teeth.setAttribute('role','button');
      teeth.setAttribute('tabindex','0');
      teeth.setAttribute('aria-label','部位を選択');
      [['ur',true],['ul',false],['lr',true],['ll',false]].forEach(function(q){
        var cell=document.createElement('div');
        cell.className='q '+q[0];
        cell.textContent=qText(it.teeth[q[0]], q[1]);
        teeth.appendChild(cell);
      });
      if(toothCount(it.teeth)===0){
        var hint=document.createElement('span');
        hint.className='teeth-hint';
        hint.textContent='部位';
        teeth.appendChild(hint);
      }
      function open(){ openToothPicker(idx); }
      teeth.addEventListener('click',open);
      teeth.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
      tdTeeth.appendChild(teeth);
      tr.appendChild(tdTeeth);

      /* 数量 */
      var tdQty=document.createElement('td');
      tdQty.className='c-qty';
      var qtyIn=document.createElement('input');
      qtyIn.className='i-qty'; qtyIn.inputMode='numeric'; qtyIn.value=it.qty;
      qtyIn.addEventListener('input',function(){ it.qty=qtyIn.value; it.qtyManual=true; updateTotals(); save(); });
      tdQty.appendChild(qtyIn);
      tr.appendChild(tdQty);

      /* 単価 */
      var tdPrice=document.createElement('td');
      tdPrice.className='c-price';
      var priceIn=document.createElement('input');
      priceIn.inputMode='numeric';
      priceIn.value=it.price!==''&&it.price!=null?fmt(num(it.price)):'';
      priceIn.addEventListener('input',function(){ it.price=priceIn.value; updateTotals(); save(); });
      priceIn.addEventListener('blur',function(){ if(priceIn.value!=='') priceIn.value=fmt(num(priceIn.value)); });
      tdPrice.appendChild(priceIn);
      tr.appendChild(tdPrice);

      /* 金額 */
      var tdAmt=document.createElement('td');
      tdAmt.className='c-amt';
      tdAmt.setAttribute('data-amount', idx);
      tdAmt.textContent=fmt(lineAmount(it));
      tr.appendChild(tdAmt);

      /* 削除（画面のみ） */
      var tdDel=document.createElement('td');
      tdDel.className='c-del';
      var del=document.createElement('button');
      del.className='item-del'; del.textContent='✕'; del.title='この項目を削除';
      del.addEventListener('click',function(){
        doc.items.splice(idx,1);
        renderItems(); updateTotals(); save(); fitSheet();
      });
      tdDel.appendChild(del);
      tr.appendChild(tdDel);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    area.appendChild(table);

    if(!doc.items.length){
      var e=document.createElement('div');
      e.className='items-empty';
      e.textContent='「＋ 行を追加」で入力するか、下の料金表から項目をタップして追加してください';
      area.appendChild(e);
    }

    var addBtn=document.createElement('button');
    addBtn.className='item-add';
    addBtn.textContent='＋ 行を追加';
    addBtn.addEventListener('click',function(){
      doc.items.push({name:'', price:'', qty:'1', qtyManual:false, teeth:{ur:[],ul:[],lr:[],ll:[]}});
      renderItems(); updateTotals(); save(); fitSheet();
    });
    area.appendChild(addBtn);
  }

  /* ---------- header / clinic fields ---------- */
  function bindFields(){
    var doc=cur();
    document.querySelectorAll('[data-field]').forEach(function(el){
      var f=el.dataset.field;
      el.value = doc[f]!=null ? doc[f] : '';
    });
    document.querySelectorAll('[data-clinic]').forEach(function(el){
      el.value = state.clinic[el.dataset.clinic]||'';
    });
  }
  document.querySelectorAll('[data-field]').forEach(function(el){
    el.addEventListener('input',function(){
      cur()[el.dataset.field]=el.value;
      save();
    });
  });
  document.querySelectorAll('[data-clinic]').forEach(function(el){
    el.addEventListener('input',function(){
      state.clinic[el.dataset.clinic]=el.value;
      save();
    });
  });

  /* ---------- price list panel ---------- */
  var activeTab=0, plEditing=false;
  function renderTabs(){
    var tabs=$('plTabs');
    tabs.innerHTML='';
    state.prices.forEach(function(t, i){
      var b=document.createElement('button');
      b.className='tab'+(i===activeTab?' active':'');
      b.textContent=t.tab;
      b.addEventListener('click',function(){ activeTab=i; renderTabs(); renderPlBody(); });
      tabs.appendChild(b);
    });

  /* ---------- tooth picker ---------- */
  var pickerIdx=null, showDeciduous=false;
  var PERM=['8','7','6','5','4','3','2','1'];
  var DEC=['E','D','C','B','A'];

  function pickerItem(){
    var doc=cur();
    return (pickerIdx!=null && doc.items[pickerIdx]) ? doc.items[pickerIdx] : null;
  }
  function openToothPicker(idx){
    pickerIdx=idx;
    var it=pickerItem();
    if(!it) return;
    showDeciduous = ['ur','ul','lr','ll'].some(function(q){
      return (it.teeth[q]||[]).some(function(x){ return /[A-E]/.test(x); });
    });
    $('toothTitle').textContent='部位を選択'+(it.name?'：'+it.name:'');
    renderMouth();
    $('toothOverlay').classList.add('open');
  }
  function closeToothPicker(){
    $('toothOverlay').classList.remove('open');
    pickerIdx=null;
    renderItems(); updateTotals(); save(); fitSheet();
  }
  function syncQtyFromTeeth(it){
    if(it.qtyManual) return;
    var c=toothCount(it.teeth);
    it.qty = c>0 ? String(c) : '1';
  }
  function renderMouth(){
    var it=pickerItem();
    if(!it) return;
    var grid=$('mouthGrid');
    grid.innerHTML='';
    /* 診察者から見た配置：向かって左＝患者の右側 */
    [
      {q:'ur', cls:'qur', lbl:'右上', right:true},
      {q:'ul', cls:'qul', lbl:'左上', right:false},
      {q:'lr', cls:'qlr', lbl:'右下', right:true},
      {q:'ll', cls:'qll', lbl:'左下', right:false}
    ].forEach(function(cfg){
      var quad=document.createElement('div');
      quad.className='quad '+cfg.cls;
      var lbl=document.createElement('span');
      lbl.className='lbl'; lbl.textContent=cfg.lbl;
      var lower = cfg.q==='lr'||cfg.q==='ll';
      if(!lower) quad.appendChild(lbl);

      function makeRow(labels){
        var row=document.createElement('div');
        row.className='trow';
        var ordered = cfg.right ? labels : labels.slice().reverse();
        ordered.forEach(function(lab){
          var b=document.createElement('button');
          b.className='tooth'+(((it.teeth[cfg.q]||[]).indexOf(lab)>=0)?' sel':'');
          b.textContent=lab;
          b.addEventListener('click',function(){
            var arr=it.teeth[cfg.q]||(it.teeth[cfg.q]=[]);
            var i=arr.indexOf(lab);
            if(i>=0) arr.splice(i,1); else arr.push(lab);
            syncQtyFromTeeth(it);
            renderMouth(); save();
          });
          row.appendChild(b);
        });
        return row;
      }
      var rows=[makeRow(PERM)];
      if(showDeciduous) rows.push(makeRow(DEC));
      if(lower) rows.reverse();
      rows.forEach(function(r){ quad.appendChild(r); });
      if(lower) quad.appendChild(lbl);
      grid.appendChild(quad);
    });

    var n=teethNotation(it.teeth), c=toothCount(it.teeth);
    $('toothPreview').textContent = c>0 ? (n.up+'　'+n.low+'　（'+c+'本）') : '未選択';
    $('btnDeciduous').textContent = showDeciduous ? '乳歯（A〜E）を隠す' : '乳歯（A〜E）を表示';
  }
  $('btnDeciduous').addEventListener('click',function(){ showDeciduous=!showDeciduous; renderMouth(); });
  $('btnToothClear').addEventListener('click',function(){

  /* ---------- PDF生成（A4 Canvas描画 → 自前PDF組み立て） ---------- */
  var MM = 1654/210;                      /* px per mm（約200dpi） */
  var SERIF = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif';
  /* 配色（画面のシートと揃える・あいおいロゴのライム×スカイブルー） */
  var C_INK='#241f18', C_ACCENT='#796345', C_SOFT='#faf4ea',
      C_LABEL='#a3906f', C_MUTED='#6b6257', C_HAIR='#e8e0d2', C_FOOT='#6b6257',
      C_GOLD='#cb890c', C_BROWN='#796345',
      C_TH_BG='#f4ecdd', C_TH_TX='#7a5f2e';
  function fpx(pt){ return pt/72*25.4*MM; }

  function newPageCanvas(){
    var cv=document.createElement('canvas');
    cv.width=1654; cv.height=2339;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.textBaseline='middle';
    return {cv:cv, ctx:ctx};
  }
  function setFont(ctx,pt,bold){ ctx.font=(bold?'600 ':'')+fpx(pt)+'px '+SERIF; }
  function measure(ctx,text,pt,bold,lsEm){
    setFont(ctx,pt,bold);
    var w=0;
    for(var i=0;i<text.length;i++) w+=ctx.measureText(text[i]).width;
    if(text.length>1) w+=(lsEm||0)*fpx(pt)*(text.length-1);
    return w/MM;
  }
  /* x,y はmm。alignは 'left'|'center'|'right' */
  function drawRect(ctx,x,y,w,h,color){
    ctx.fillStyle=color;
    ctx.fillRect(x*MM,y*MM,w*MM,h*MM);
  }
  function drawText(ctx,text,x,y,opt){
    opt=opt||{};
    var pt=opt.pt||10.5, bold=opt.bold||false, ls=opt.ls||0;
    setFont(ctx,pt,bold);
    ctx.fillStyle=opt.color||C_INK;
    var total=measure(ctx,text,pt,bold,ls);
    var sx = opt.align==='center' ? x-total/2 : (opt.align==='right' ? x-total : x);
    var px=sx*MM;
    for(var i=0;i<text.length;i++){
      ctx.fillText(text[i],px,y*MM);
      px+=ctx.measureText(text[i]).width + ls*fpx(pt);
    }
  }
  function drawLine(ctx,x1,y1,x2,y2,wMm,color){
    ctx.strokeStyle=color||C_INK;
    ctx.lineWidth=wMm*MM;
    ctx.beginPath();
    ctx.moveTo(x1*MM,y1*MM);
    ctx.lineTo(x2*MM,y2*MM);
    ctx.stroke();
  }

  function renderQuotePages(){
    var doc=cur();
    var L=18,R=192;
    var pages=[];
    var p=newPageCanvas(); pages.push(p);
    var ctx=p.ctx;

    /* --- タイトル --- */
    drawText(ctx,'御見積書',105,23,{pt:18,bold:true,ls:.9,align:'center',color:C_ACCENT});
    drawLine(ctx,L,28.5,R,28.5,.35,C_GOLD);
    drawLine(ctx,L,29.7,R,29.7,.8,C_BROWN);

    /* 文字列を幅maxWmmで折り返し */
    function wrapText(text,pt,maxW){
      var out=[];
      String(text||'').split('\n').forEach(function(par){
        var line='';
        for(var i=0;i<par.length;i++){
          var t=line+par[i];
          if(measure(ctx,t,pt,false,0)>maxW && line!==''){ out.push(line); line=par[i]; }
          else line=t;
        }
        out.push(line);
      });
      return out;
    }

    /* --- 宛名（左）・作成日と医院情報（右） --- */
    var pname=(doc.patient||'')+'';
    drawText(ctx,pname,L+1,42,{pt:13.5,ls:.1});
    var nw=measure(ctx,pname,13.5,false,.1);
    drawText(ctx,'様',L+4+nw,42.5,{pt:11.5});
    drawLine(ctx,L,46,L+88,46,.3);

    /* 作成日（右上） */
    drawText(ctx,doc.issueDate||'',R,32.5,{pt:10,align:'right'});
    var dw=measure(ctx,doc.issueDate||'',10,false,0);
    drawText(ctx,'作成日',R-dw-4,32.7,{pt:8.5,align:'right',color:C_LABEL});
    /* ロゴ（医院名入りの横ロゴ・右寄せ） */
    var iy=39;
    if(logoImg.complete && logoImg.naturalWidth){
      var logoW=57, logoH=logoW*logoImg.naturalHeight/logoImg.naturalWidth;
      ctx.drawImage(logoImg,(R-logoW)*MM,35*MM,logoW*MM,logoH*MM);
      iy=35+logoH+4.2;
    }
    if(state.clinic.address){ drawText(ctx,state.clinic.address,R,iy,{pt:8.5,align:'right',color:C_FOOT}); iy+=4.2; }
    if(state.clinic.tel){ drawText(ctx,state.clinic.tel,R,iy,{pt:8.5,align:'right',color:C_FOOT}); }

    /* --- お見積金額 --- */
    var sub=0;
    doc.items.forEach(function(it){ sub+=lineAmount(it); });
    var total=sub;   /* 単価はすべて税込 */
    drawRect(ctx,L,58,R-L,14,C_SOFT);
    drawLine(ctx,L,58,R,58,.3,C_GOLD);
    drawLine(ctx,L,72,R,72,.3,C_GOLD);
    var g1='お見積金額', g2=yen(total), g3='（税込）';
    var w1=measure(ctx,g1,10.5,false,.5), w2=measure(ctx,g2,17,true,.05), w3=measure(ctx,g3,8.5,false,0);
    var gw=w1+7+w2+3+w3, gx=105-gw/2;
    drawText(ctx,g1,gx,65,{pt:10.5,ls:.5});
    drawText(ctx,g2,gx+w1+7,65,{pt:17,bold:true,ls:.05,color:C_ACCENT});
    drawText(ctx,g3,gx+w1+7+w2+3,65.8,{pt:8.5,color:C_LABEL});

    /* --- 明細テーブル --- */
    /* 列: 品名 L..104 / 部位 104..140 / 数量 140..152 / 単価 152..172 / 金額 172..R */
    var cTeethL=104, cTeethR=140, cQtyC=146, cPriceR=170, cAmtR=190;
    function drawTableHeader(yTop){
      drawRect(ctx,L,yTop,R-L,9,C_TH_BG);
      drawLine(ctx,L,yTop,R,yTop,.35,C_GOLD);
      drawLine(ctx,L,yTop+9,R,yTop+9,.35,C_GOLD);
      var hy=yTop+4.5;
      drawText(ctx,'品 名',61,hy,{pt:9,ls:.25,align:'center',color:C_TH_TX,bold:true});
      drawText(ctx,'部 位',122,hy,{pt:9,ls:.25,align:'center',color:C_TH_TX,bold:true});
      drawText(ctx,'数量',146,hy,{pt:9,ls:.15,align:'center',color:C_TH_TX,bold:true});
      drawText(ctx,'単 価',161,hy,{pt:9,ls:.25,align:'center',color:C_TH_TX,bold:true});
      drawText(ctx,'金 額',181,hy,{pt:9,ls:.25,align:'center',color:C_TH_TX,bold:true});
      return yTop+9;
    }
    /* --- 1ページに必ず収める：項目数に応じて行高と文字サイズを自動調整 --- */
    var n=doc.items.length;
    var noteLines=wrapText(doc.note||'',9.5,150);
    if(!(doc.note||'').trim()) noteLines=[];
    var noteH=Math.max(14, 7+noteLines.length*5.5+4);
    var tableTop=78, pageBottom=284, totalsH=17, gapA=4, gapB=5;
    var availRows=pageBottom-tableTop-9-gapA-totalsH-gapB-noteH;
    var rowH = n>0 ? Math.min(14, Math.max(5.5, availRows/n)) : 14;
    var rPt = Math.max(7.5, Math.min(10.5, 10.5*Math.pow(rowH/14,.6)));
    var tPt = Math.max(6.5, rPt-1.5);

    var y=drawTableHeader(tableTop);
    doc.items.forEach(function(it){
      var mid=y+rowH/2;
      /* 品名（行高が十分なら2行まで折返し） */
      var lines=wrapText(it.name||'',rPt,82);
      if(rowH>=10 && lines.length>=2){
        if(lines.length>2){ lines=lines.slice(0,2); lines[1]=lines[1].slice(0,-1)+'…'; }
        drawText(ctx,lines[0],L+2,mid-2.6,{pt:rPt});
        drawText(ctx,lines[1],L+2,mid+2.6,{pt:rPt});
      }else{
        var ln=lines[0]||'';
        if(lines.length>1) ln=ln.slice(0,-1)+'…';
        drawText(ctx,ln,L+2,mid,{pt:rPt});
      }
      /* 部位ミニ十字 */
      var has=toothCount(it.teeth)>0;
      var crossC = has ? '#6b6257' : '#d9cdb8';
      var cx=122;
      drawLine(ctx,cx,y+1,cx,y+rowH-1,.3,crossC);
      drawLine(ctx,109,mid,135,mid,.3,crossC);
      if(has){
        var tOff=Math.max(1.9, rowH/4-0.7);
        drawText(ctx,qText(it.teeth.ur,true), cx-1.5,mid-tOff,{pt:tPt,ls:.2,align:'right'});
        drawText(ctx,qText(it.teeth.ul,false),cx+1.5,mid-tOff,{pt:tPt,ls:.2});
        drawText(ctx,qText(it.teeth.lr,true), cx-1.5,mid+tOff,{pt:tPt,ls:.2,align:'right'});
        drawText(ctx,qText(it.teeth.ll,false),cx+1.5,mid+tOff,{pt:tPt,ls:.2});
      }
      /* 数量・単価・金額 */
      drawText(ctx,String(num(it.qty)),cQtyC,mid,{pt:rPt,align:'center'});
      drawText(ctx,fmt(num(it.price)),cPriceR,mid,{pt:rPt,align:'right'});
      drawText(ctx,fmt(lineAmount(it)),cAmtR,mid,{pt:rPt,align:'right'});
      drawLine(ctx,L,y+rowH,R,y+rowH,.15,C_HAIR);
      y+=rowH;
    });

    /* --- 合計欄（単価がすべて税込なので1行） --- */
    y+=gapA;
    var tX=124;
    drawLine(ctx,tX,y+1.5,R,y+1.5,.3,C_ACCENT);
    drawText(ctx,'合計（税込）',tX+2,y+8,{pt:12.5,bold:true,color:C_ACCENT});
    drawText(ctx,yen(total),R-1,y+8,{pt:12.5,bold:true,align:'right',color:C_ACCENT});
    drawLine(ctx,tX,y+12.5,R,y+12.5,.35,C_ACCENT);
    drawLine(ctx,tX,y+13.7,R,y+13.7,.35,C_ACCENT);
    y+=totalsH;

    /* --- 備考欄（常に同一ページ） --- */
    var boxTop=y+gapB;
    ctx.strokeStyle='#ddcdb0';
    ctx.lineWidth=.2*MM;
    ctx.strokeRect(L*MM,boxTop*MM,(R-L)*MM,noteH*MM);
    drawText(ctx,'備 考',L+3,boxTop+6,{pt:9,ls:.3,color:C_ACCENT});
    noteLines.forEach(function(ln,i){
      drawText(ctx,ln,L+17,boxTop+6+i*5.5,{pt:9.5,color:C_INK});
    });

    return pages.map(function(pg){ return pg.cv; });
  }

  function canvasJpegBytes(cv){
    var d=cv.toDataURL('image/jpeg',0.93);
    var b=atob(d.split(',')[1]);
    var u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return u;
  }
  function buildPdf(canvases){
    var W=595.28,H=841.89;
    var enc=new TextEncoder();
    var parts=[],offset=0,offsets=[];
    function push(x){
      var u=(typeof x==='string')?enc.encode(x):x;
      parts.push(u); offset+=u.length;
    }
    function beginObj(){ offsets.push(offset); }
    push('%PDF-1.4\n');
    beginObj(); push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
    var kids=canvases.map(function(_,i){ return (3+i*3)+' 0 R'; }).join(' ');
    beginObj(); push('2 0 obj\n<</Type/Pages/Kids['+kids+']/Count '+canvases.length+'>>\nendobj\n');
    canvases.forEach(function(cv,i){
      var pn=3+i*3, cn=pn+1, xn=pn+2;
      beginObj();
      push(pn+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']/Resources<</XObject<</Im'+i+' '+xn+' 0 R>>/ProcSet[/PDF/ImageC]>>/Contents '+cn+' 0 R>>\nendobj\n');
      var cs='q '+W+' 0 0 '+H+' 0 0 cm /Im'+i+' Do Q';
      beginObj();
      push(cn+' 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\nendobj\n');
      var img=canvasJpegBytes(cv);
      beginObj();
      push(xn+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+img.length+'>>\nstream\n');
      push(img);
      push('\nendstream\nendobj\n');
    });
    var xrefStart=offset;
    var n=offsets.length+1;
    var xref='xref\n0 '+n+'\n0000000000 65535 f \n';
    offsets.forEach(function(o){
      xref+=('0000000000'+o).slice(-10)+' 00000 n \n';
    });
    push(xref);
    push('trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xrefStart+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  }

  var pdfUrl=null, pdfBlob=null, pdfName='';
  /* Artifactページ等、iframe内で動いている場合は共有シート・ダウンロードが
     ブロックされることがあるため、常にプレビューを直接開く */
  var IN_FRAME=(function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
  function openPdfOverlay(canvases, blob, name){
    var wrap=$('pdfPages');
    wrap.innerHTML='';
    canvases.forEach(function(cv,i){
      var img=document.createElement('img');
      img.src=cv.toDataURL('image/jpeg',0.93);
      img.alt='見積書 '+(i+1)+'ページ目';
      wrap.appendChild(img);
    });
    if(pdfUrl) URL.revokeObjectURL(pdfUrl);
    pdfUrl=URL.createObjectURL(blob);
    pdfBlob=blob; pdfName=name;
    var dl=$('pdfDl');
    dl.href=pdfUrl;
    dl.setAttribute('download',name);
    if(IN_FRAME){
      /* Artifactのsandbox内ではPDFダウンロード・共有シートが使えない */
      dl.style.display='none';
      $('pdfHint').innerHTML=
        'そのまま印刷するなら「<strong>🖨 このまま印刷</strong>」。<br>'
        +'<strong>画像で残す場合</strong>：下のプレビュー画像を<strong>長押し</strong> → 「<strong>“写真”に追加</strong>」<br>'
        +'→ <strong>写真アプリ</strong>で開く → 共有ボタン → 「<strong>プリント</strong>」（メニューを下にスクロールすると出てきます）';
    }
    $('pdfOverlay').classList.add('open');
  }
  $('btnPdfClose').addEventListener('click',function(){ $('pdfOverlay').classList.remove('open'); });
  $('pdfOverlay').addEventListener('click',function(e){ if(e.target===this) $('pdfOverlay').classList.remove('open'); });

  /* iframe内では a[download] が無効なことがある → 共有シートで代替 */
  $('pdfDl').addEventListener('click',function(e){
    if(!IN_FRAME) return;
    e.preventDefault();
    var f=null;
    try{ f=new File([pdfBlob], pdfName, {type:'application/pdf'}); }catch(err){}
    var hint='この環境ではPDFファイルの保存が制限されています。上のプレビュー画像を長押し（またはコピー）して「写真に保存」→写真アプリから共有・プリントしてください。';
    if(f && navigator.canShare && navigator.share && navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).catch(function(err){
        if(!err || err.name!=='AbortError') appNotice(hint);
      });
    }else{
      appNotice(hint);
    }
  });

  /* 見積書を1回だけ描画して canvas・PDF・ファイル名をまとめて返す */
  function makeQuote(){
    try{
      var canvases=renderQuotePages();
      return {
        canvases:canvases,
        blob:buildPdf(canvases),
        name:'見積書_'+(cur().patient||'無題')+'_'+(cur().issueDate||'').replace(/\//g,'')+'.pdf'
      };
    }catch(e){
      appNotice('見積書の作成に失敗しました: '+e.message);
      return null;
    }
  }

  /* ---------- ワンタップ印刷（PC・iPad共通：ブラウザの印刷画面を直接開く） ---------- */
  function endPrint(){
    document.body.classList.remove('print-image');
    $('printArea').innerHTML='';
  }
  window.addEventListener('afterprint',endPrint);
  function printQuote(canvases){
    var area=$('printArea');
    area.innerHTML='';
    canvases.forEach(function(cv,i){
      var img=document.createElement('img');
      img.src=cv.toDataURL('image/jpeg',0.93);
      img.alt='見積書 '+(i+1)+'ページ目';
      area.appendChild(img);
    });
    /* 画像の読み込みを待ってから印刷（待たないと白紙で刷られることがある）
       ※ display:none の中では img.decode() が解決しない環境があるため使わない */
    var imgs=Array.prototype.slice.call(area.querySelectorAll('img'));
    Promise.all(imgs.map(function(im){
      return new Promise(function(done){
        if(im.complete && im.naturalWidth) return done();
        var t=setTimeout(done,2000);
        im.addEventListener('load',function(){ clearTimeout(t); done(); },{once:true});
        im.addEventListener('error',function(){ clearTimeout(t); done(); },{once:true});
      });
    })).then(function(){
      document.body.classList.add('print-image');
      setTimeout(function(){
        try{ window.print(); }
        catch(e){ endPrint(); appNotice('印刷画面を開けませんでした: '+e.message); }
        /* afterprintが来ない環境（iOS等）の保険 */
        setTimeout(endPrint, 60000);
      },80);
    });
  }

  $('btnPrint').addEventListener('click',function(){
    var q=makeQuote();
    if(q) printQuote(q.canvases);
  });
  $('btnPrintFromPdf').addEventListener('click',function(){
    $('pdfOverlay').classList.remove('open');
    var q=makeQuote();
    if(q) printQuote(q.canvases);
  });

  $('btnPdf').addEventListener('click',function(){
    var q=makeQuote();
    if(!q) return;
    /* iPad/iPhone（単独ページで開いている場合）: 共有シートを直接開く */
    var file=null;
    try{ file=new File([q.blob], q.name, {type:'application/pdf'}); }catch(e){}
    if(!IN_FRAME && file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).catch(function(err){
        if(!err || err.name!=='AbortError') openPdfOverlay(q.canvases, q.blob, q.name);
      });
      return;
    }
    openPdfOverlay(q.canvases, q.blob, q.name);
  });

  /* ---------- fit sheet to screen ---------- */
  function fitSheet(){
    var wrap=$('sheetWrap'), sheet=$('sheet');
    sheet.style.transform='none';
    var w=sheet.offsetWidth, avail=wrap.clientWidth;
    var s=Math.min(1, avail/w);
    sheet.style.transform='scale('+s+')';
    wrap.style.height=(sheet.offsetHeight*s)+'px';
  }
  window.addEventListener('resize',fitSheet);

  /* ---------- boot ---------- */
  function renderAll(){
    bindFields(); renderItems(); updateTotals(); renderTabs(); renderPlBody();
    requestAnimationFrame(fitSheet);
  }
  $('sheetLogo').src=LOGO_SRC;
  renderAll();
})();
</script>
